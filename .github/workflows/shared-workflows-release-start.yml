name: Shared workflows - Release start

on:
  workflow_call:
    inputs:
      source-branch:
        description: "Source branch to create release branch from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  auth:
    uses: ./.github/workflows/get-github-token.yml
    secrets: inherit

  debug:
    needs: auth
    runs-on: ubuntu-latest

    steps:
      - name: Show output length
        run: |
          echo "Token length: ${#TOKEN}"
        env:
          TOKEN: ${{ needs.auth.outputs.token }}

  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ needs.auth.outputs.token }}

      - name: Create Pull Request
        run: |
          gh pr create \
            --base main \
            --head "${{ inputs.source-branch }}" \
            --title "chore(release): merge ${{ inputs.source-branch }} into main" \
            --body "Created by GitHub action"
        env:
          GITHUB_TOKEN: ${{ needs.auth.outputs.token }}
