name: Shared workflows - Release start

on:
  workflow_call:
    inputs:
      source-branch:
        description: "Source branch to create release branch from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Create Pull Request
        run: |
          gh pr create \
            --base main \
            --head "${{ inputs.source-branch }}" \
            --title "chore(release): merge ${{ inputs.source-branch }} into main" \
            --body "Created by GitHub action"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
