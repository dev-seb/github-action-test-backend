name: Shared workflows - Release start

on:
  workflow_call:
    inputs:
      source-branch:
        description: "Source branch to create release branch from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Create Pull Request
        id: create-pr
        run: |
          pr_url=$(gh pr create \
            --base main \
            --head "${{ inputs.source-branch }}" \
            --title "chore(release): merge ${{ inputs.source-branch }} into main" \
            --body "Created by GitHub action")

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(echo "$pr_url" | grep -oE '[0-9]+$')" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: "Enable auto-approval"
        if: ${{ steps.create-pr.outputs.pr_number != '' }}
        continue-on-error: true
        run: |
          gh pr review ${{ steps.create-pr.outputs.pr_number }} --approve
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_GITHUB_TOKEN }}

      - name: Enable auto-merge (Merge commit)
        if: ${{ steps.create-pr.outputs.pr_number != '' }}
        continue-on-error: true
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pr_number }} --auto --merge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
