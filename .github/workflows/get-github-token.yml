name: Shared workflows - Get GitHub token

on:
  workflow_call:
    outputs:
      token:
        description: "GitHub App installation token"
        value: ${{ jobs.generate-token.outputs.token }}

jobs:
  generate-token:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Debug Token Presence
        run: |
          if [ -z "${{ steps.app-token.outputs.token }}" ]; then
            echo "❌ ERROR: The token is completely empty!"
            exit 1
          else
            echo "✅ Success: The token is populated (GitHub will mask it below)."
          fi

      - name: Test the token with GitHub CLI
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The token is automatically masked by GitHub Actions (displays as ***)
          echo "Checking GitHub App authentication status in step..."
          gh api repos/$GITHUB_REPOSITORY

  use-token:
    runs-on: ubuntu-latest
    needs: generate-token
    steps:
      - name: Debug Token Presence
        run: |
          if [ -z "${{ needs.generate-token.outputs.token }}" ]; then
            echo "❌ ERROR: The token is completely empty!"
            exit 1
          else
            echo "✅ Success: The token is populated (GitHub will mask it below)."
          fi

      - name: Test the token with GitHub CLI
        env:
          GH_TOKEN: ${{ needs.generate-token.outputs.token }}
        run: |
          # The token is automatically masked by GitHub Actions (displays as ***)
          echo "Checking GitHub App authentication status in job..."
          gh api repos/$GITHUB_REPOSITORY
